[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aristoteles"
version = "0.1.0"
description = "Assistente virtual de voz local para Linux, com Claude como cérebro"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "webrtcvad-wheels>=2.0.14",
    "piper-tts>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
# Backend de STT em CPU (padrao). CTranslate2 nao suporta GPU AMD.
cpu = ["faster-whisper>=1.0"]
# Palavra de ativacao (fase 5).
# NAO instale com `pip install -e '.[wake]'`: o openwakeword exige tflite-runtime
# no Linux, que nao tem wheel para Python 3.12. Use ./scripts/05_instalar_wake.sh,
# que instala sem deps (usamos o backend onnx, o tflite nunca e importado).
wake = ["openwakeword>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
aristoteles = "aristoteles.__main__:main"

[tool.setuptools.packages.find]
include = ["aristoteles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
